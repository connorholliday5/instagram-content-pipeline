[project]
name = "comic-data-lab"
version = "0.1.0"
description = "Comic release ingestion + analytics + publishing pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "matplotlib>=3.8",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
